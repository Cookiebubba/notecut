[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notecut"
version = "0.1.0"
description = "Timestamped video review for humans, machine-readable edit state for agents. One stdlib-only server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["video", "review", "editing", "agents", "transcript", "edl"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video",
]
dependencies = []

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
fast = ["numpy>=1.24"]
dev = ["pytest>=7"]

[project.scripts]
notecut = "notecut.cli:main"

[project.urls]
Homepage = "https://github.com/Cookiebubba/notecut"

[tool.setuptools]
packages = ["notecut"]
include-package-data = true

[tool.setuptools.package-data]
notecut = ["static/*", "examples/demo/*", "examples/demo/**/*"]
