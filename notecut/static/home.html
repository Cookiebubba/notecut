<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1"><title>Note Cut</title><link rel=icon href="/logo.png">
<style>
:root{--bg:#f6f6f7;--panel:#ffffff;--line:#d6d8dc;--ink:#1b1b1d;--dim:#7c7f85;--done:#2e7d4f;--doneb:rgba(46,125,79,.10);--hover:rgba(0,0,0,.045)}
[data-theme=dark]{--bg:#0e0f11;--panel:#16181c;--line:#2b2e33;--ink:#e8e8e6;--dim:#8b9096;--done:#4caf7d;--doneb:rgba(76,175,125,.14);--hover:rgba(255,255,255,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block}
header{display:flex;align-items:center;gap:10px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font:600 14px/1 "Segoe UI",system-ui;margin:0;flex:1}header .sub{color:var(--dim);font-size:12px}
.gl{border:none;background:transparent;color:var(--dim);padding:6px;cursor:pointer;border-radius:6px}.gl:hover{color:var(--ink);background:var(--hover)}
main{padding:22px;max-width:1280px;margin:0 auto}
.sec{color:var(--dim);font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin:6px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:28px}
a.card{display:block;color:inherit;text-decoration:none;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;transition:border-color .12s,transform .12s}
a.card:hover{border-color:var(--dim);transform:translateY(-1px)}
.poster{position:relative;aspect-ratio:16/9;background:#000 no-repeat;background-size:auto}
.poster .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.7);color:#fff;font:12px ui-monospace,monospace;padding:2px 6px;border-radius:4px}
.poster .ver{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px}
.body{padding:12px 14px}
.t{font-weight:600;line-height:1.35;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{color:var(--dim);font-size:12px;display:flex;flex-wrap:wrap;gap:6px 12px}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--dim)}
.pill.open{color:var(--ink);border-color:var(--dim)}.pill.done{color:var(--done);border-color:var(--done);background:var(--doneb)}
.empty{color:var(--dim);padding:40px;text-align:center;border:1px dashed var(--line);border-radius:10px}
</style></head><body>
<header><img src="/logo.png" alt="Note Cut" style="width:26px;height:26px"><h1>Note Cut <span class=sub>&middot; videos in the edit</span></h1>
<button id=theme class=gl title="toggle theme"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button></header>
<main>__CARDS__</main>
<script>
const theme=localStorage.getItem("rv-theme")||"light";if(theme==="dark")document.body.dataset.theme="dark";
document.getElementById("theme").onclick=()=>{const d=document.body.dataset.theme==="dark";
  if(d)document.body.removeAttribute("data-theme");else document.body.dataset.theme="dark";localStorage.setItem("rv-theme",d?"light":"dark");};
</script></body></html>
